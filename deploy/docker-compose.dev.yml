services:
  backend:
    image: ghcr.io/${GHCR_NAMESPACE}/ecommerce-backend:${IMAGE_TAG}
    container_name: ecommerce-backend
    restart: unless-stopped

    env_file:
      - backend.env

    environment:
      NODE_ENV: production
      PORT: 3001

    expose:
      - "3001"

    networks:
      - ecommerce

  frontend:
    image: ghcr.io/${GHCR_NAMESPACE}/ecommerce-frontend:${IMAGE_TAG}
    container_name: ecommerce-frontend
    restart: unless-stopped

    environment:
      VITE_API_URL: /api

    expose:
      - "5173"

    networks:
      - ecommerce

  nginx:
    image: nginx:1.27-alpine
    container_name: ecommerce-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend
      - frontend

    networks:
      - ecommerce

networks:
  ecommerce:
    driver: bridge