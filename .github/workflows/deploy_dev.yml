name: Build and Deplo

on:
  push:
    branches:
      - dev
      - qa
      - main

permissions:
  contents: read
  packages: write

env:
  GHCR_NAMESPACE: rusiru200m

jobs:
  determine_environment:
    name: Determine Environment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}

    steps:
      - name: Determine environment
        id: set-env
        shell: bash
        run: |

          case "${GITHUB_REF_NAME}" in

            dev)
              ENVIRONMENT="dev"
              ;;

            qa)
              ENVIRONMENT="qa"
              ;;

            main)
              ENVIRONMENT="production"
              ;;

            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}"
              exit 1
              ;;

          esac

          IMAGE_TAG="${ENVIRONMENT}-${GITHUB_SHA::7}"

          echo "Environment: ${ENVIRONMENT}"
          echo "Image tag: ${IMAGE_TAG}"

          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"



  validate:
    name: Validate required files
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          test -f docker-compose.yml


  
  build_push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    needs:
      - determine_environment
      - validate

    environment:
      name: ${{ needs.determine_environment.outputs.environment }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show deployment information
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Environment: ${{ needs.determine_environment.outputs.environment }}"
          echo "Image tag: ${{ needs.determine_environment.outputs.image_tag }}"

     
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          cache-from: type=gha,scope=ecommerce-backend
          cache-to: type=gha,mode=max,scope=ecommerce-backend
          provenance: false
          tags: |
            ghcr.io/${{ env.GHCR_NAMESPACE }}/ecommerce-backend:${{ needs.determine_environment.outputs.image_tag }}

     
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          cache-from: type=gha,scope=ecommerce-frontend
          cache-to: type=gha,mode=max,scope=ecommerce-frontend
          provenance: false
          tags: |
            ghcr.io/${{ env.GHCR_NAMESPACE }}/ecommerce-frontend:${{ needs.determine_environment.outputs.image_tag }}

  deploy:
    name: Deploy to DigitalOcean VPS
    needs:
      - determine_environment
      - build_push

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
