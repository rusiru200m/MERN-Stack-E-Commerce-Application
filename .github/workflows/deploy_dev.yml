name: Build and push images to GHCR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish, for example v1.0.0 or dev-1
        required: true
        default: v1.0.0
        type: string
  push:
    branches:
      - feature/ci-cd-for-dev
    

permissions:
  contents: read
  packages: write

env:
  # Change this manually if the images should be published under another owner.
  GHCR_NAMESPACE: rusiru200m

jobs:
  validate:
    name: Validate required files exist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files exist
        run: |
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          test -f docker-compose.yml

  build_push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs:
      - validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show image tag
        run: |
          echo "Images will be pushed with manually selected tag: ${{ inputs.image_tag }}"
          echo "Registry namespace: ghcr.io/${{ env.GHCR_NAMESPACE }}"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.GHCR_NAMESPACE }}/ecommerce-backend:${{ inputs.image_tag }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.GHCR_NAMESPACE }}/ecommerce-frontend:${{ inputs.image_tag }}

