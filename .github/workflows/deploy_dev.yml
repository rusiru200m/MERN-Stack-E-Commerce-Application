name: Build and Deploy

on:
  push:
    branches:
      - dev
      - qa
      - main

permissions:
  contents: read
  packages: write

env:
  GHCR_NAMESPACE: rusiru200m

jobs:
  determine_environment:
    name: Determine Environment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}

    steps:
      - name: Determine environment
        id: set-env
        shell: bash
        run: |

          case "${GITHUB_REF_NAME}" in

            dev)
              ENVIRONMENT="dev"
              ;;

            qa)
              ENVIRONMENT="qa"
              ;;

            main)
              ENVIRONMENT="production"
              ;;

            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}"
              exit 1
              ;;

          esac

          IMAGE_TAG="${ENVIRONMENT}-${GITHUB_SHA::7}"

          echo "Environment: ${ENVIRONMENT}"
          echo "Image tag: ${IMAGE_TAG}"

          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"



  validate:
    name: Validate required files
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          test -f docker-compose.yml


  
  build_push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    needs:
      - determine_environment
      - validate

    environment:
      name: ${{ needs.determine_environment.outputs.environment }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show deployment information
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Environment: ${{ needs.determine_environment.outputs.environment }}"
          echo "Image tag: ${{ needs.determine_environment.outputs.image_tag }}"

     
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          cache-from: type=gha,scope=ecommerce-backend
          cache-to: type=gha,mode=max,scope=ecommerce-backend
          provenance: false
          tags: |
            ghcr.io/${{ env.GHCR_NAMESPACE }}/ecommerce-backend:${{ needs.determine_environment.outputs.image_tag }}

     
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          cache-from: type=gha,scope=ecommerce-frontend
          cache-to: type=gha,mode=max,scope=ecommerce-frontend
          provenance: false
          tags: |
            ghcr.io/${{ env.GHCR_NAMESPACE }}/ecommerce-frontend:${{ needs.determine_environment.outputs.image_tag }}

  deploy:
    name: Deploy to DigitalOcean VPS
    needs:
      - determine_environment
      - build_push

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.determine_environment.outputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USERNAME: ${{ secrets.DO_USERNAME }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_PORT: ${{ secrets.DO_PORT }}
        run: |
          set -euo pipefail

          : "${DO_PORT:=22}"
          mkdir -p ~/.ssh

          if [[ -z "$DO_HOST" || -z "$DO_USERNAME" || -z "$DO_SSH_KEY" ]]; then
            echo "ERROR: DO_HOST, DO_USERNAME, and DO_SSH_KEY must be configured"
            exit 1
          fi

          # Accept either a raw private key or a Base64-encoded private key.
          if [[ "$DO_SSH_KEY" == *"BEGIN "* ]]; then
            printf '%s\n' "$DO_SSH_KEY" > ~/.ssh/id_rsa
          else
            if ! printf '%s' "$DO_SSH_KEY" | base64 --decode > ~/.ssh/id_rsa 2>/dev/null; then
              echo "ERROR: DO_SSH_KEY is neither a PEM/OpenSSH key nor valid Base64"
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/id_rsa

          if ! ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub 2>/dev/null; then
            echo "ERROR: Invalid SSH key format"
            exit 1
          fi

          : > ~/.ssh/known_hosts
          if ! ssh-keyscan -T 10 -p "$DO_PORT" "$DO_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "ERROR: Cannot reach $DO_HOST on SSH port $DO_PORT"
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

          if ! ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -p "$DO_PORT" \
            -i ~/.ssh/id_rsa \
            "$DO_USERNAME@$DO_HOST" \
            'echo "SSH connection successful"'; then
            echo "ERROR: SSH authentication failed for $DO_USERNAME@$DO_HOST:$DO_PORT"
            echo "Check that this key's public key is in ~/.ssh/authorized_keys for that user."
            exit 1
          fi


